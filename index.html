<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form & Book Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
<div class="max-w-4xl mx-auto space-y-8">

    <!-- User Details Form Section -->
    <section class="bg-white p-6 rounded shadow-md">
        <h2 class="text-2xl font-bold mb-4">User Details</h2>
        <form id="userForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">First Name *</label>
                    <input type="text" id="firstName" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Last Name *</label>
                    <input type="text" id="lastName" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email *</label>
                    <input type="email" id="email" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input type="tel" id="phone" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Skills</label>
                <select id="skills" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                    <option value="">Select a skill...</option>
                    <option value="frontend">Front-end Development</option>
                    <option value="backend">Back-end Development</option>
                    <option value="design">UI/UX Design</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div id="otherSkillsContainer" class="hidden">
                <label class="block text-sm font-medium text-gray-700">Specify Other Skill</label>
                <input type="text" id="otherSkills" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
            </div>

            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Submit</button>
        </form>
    </section>

    <!-- Open Library Search Section -->
    <section class="bg-white p-6 rounded shadow-md">
        <h2 class="text-2xl font-bold mb-4">Book Search (Open Library API)</h2>
        <div class="flex space-x-4 mb-4">
            <input type="text" id="bookTitle" placeholder="Enter book title..." class="flex-1 border border-gray-300 rounded-md p-2">
            <button id="searchBtn" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">Search</button>
        </div>

        <div id="loading" class="hidden text-blue-600 font-semibold mb-2">Searching... Please wait.</div>
        <div id="errorMessage" class="hidden text-red-600 font-semibold mb-2"></div>

        <ul id="resultsList" class="list-disc pl-5 space-y-2"></ul>
    </section>

</div>

<script>
    // --- Skills Dropdown Logic ---
    const skillsSelect = document.getElementById('skills');
    const otherSkillsContainer = document.getElementById('otherSkillsContainer');

    skillsSelect.addEventListener('change', function() {
        if (this.value === 'other') {
            otherSkillsContainer.classList.remove('hidden');
            document.getElementById('otherSkills').required = true;
        } else {
            otherSkillsContainer.classList.add('hidden');
            document.getElementById('otherSkills').required = false;
            document.getElementById('otherSkills').value = '';
        }
    });

    // --- Form Submission Logic ---
    document.getElementById('userForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        // Basic Frontend Validation
        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!firstName || !lastName || !email) {
            alert("First Name, Last Name, and Email are required.");
            return;
        }

        const formData = {
            firstName: firstName,
            lastName: lastName,
            email: email,
            phone: document.getElementById('phone').value.trim(),
            skills: skillsSelect.value === 'other' ?
                document.getElementById('otherSkills').value.trim() :
                skillsSelect.value
        };

        try {
            const response = await fetch('http://localhost:3000/api/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },

                body: JSON.stringify(formData)
            });

            const result = await response.json();


            if (response.status === 201) {
                alert('User saved successfully to database! ID: ' + result.id);
                document.getElementById('userForm').reset();
                otherSkillsContainer.classList.add('hidden');
            } else {
                alert('Error: ' + (result.error || 'Failed to save user.'));
            }
        } catch (error) {
            // CHANGED: Added catch block to handle network-level errors when the Node backend is offline or unreachable.
            alert('Network error: Could not connect to the backend API. Make sure node server.js is running.');
            console.error('Fetch error:', error);
        }

    });

    // --- Open Library Search Logic ---
    document.getElementById('searchBtn').addEventListener('click', async function() {
        const title = document.getElementById('bookTitle').value.trim();
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const resultsList = document.getElementById('resultsList');

        // Reset UI state
        errorMessage.classList.add('hidden');
        resultsList.innerHTML = '';

        if (!title) {
            errorMessage.textContent = 'Please enter a title to search.';
            errorMessage.classList.remove('hidden');
            return;
        }

        loading.classList.remove('hidden');

        try {
            const response = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}&limit=5`);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json(); // Handling JSON

            if (data.docs && data.docs.length > 0) {
                data.docs.forEach(book => {
                    const li = document.createElement('li');
                    const author = book.author_name ? book.author_name.join(', ') : 'Unknown Author';
                    const year = book.first_publish_year ? book.first_publish_year : 'Unknown Year';
                    li.textContent = `${book.title} by ${author} (${year})`;
                    resultsList.appendChild(li);
                });
            } else {
                resultsList.innerHTML = '<li>No books found.</li>';
            }
        } catch (error) {
            errorMessage.textContent = 'Failed to fetch data from Open Library. Please try again.';
            errorMessage.classList.remove('hidden');
            console.error("Open Library API Error: ", error);
        } finally {
            loading.classList.add('hidden');
        }
    });
</script>
</body>
</html>
