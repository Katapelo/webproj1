<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Form & Skill Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8 font-sans">
<div class="max-w-4xl mx-auto space-y-8">

    <!-- User Details Form Section -->
    <section class="bg-white p-6 rounded shadow-md">
        <h2 class="text-2xl font-bold mb-4">User Details</h2>
        <form id="userForm" class="space-y-4">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">First Name *</label>
                    <input type="text" id="firstName" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Last Name *</label>
                    <input type="text" id="lastName" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700">Email *</label>
                    <input type="email" id="email" required class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                    <input type="tel" id="phone" class="mt-1 block w-full border border-gray-300 rounded-md p-2">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700">Skills</label>
                <select id="skills" class="mt-1 block w-full border border-gray-300 rounded-md p-2 transition-colors">
                    <option value="">Select a skill...</option>
                    <option value="frontend">Front-end Development</option>
                    <option value="backend">Back-end Development</option>
                    <option value="design">UI/UX Design</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div id="otherSkillsContainer" class="hidden">
                <label class="block text-sm font-medium text-gray-700">Specify Other Skill</label>
                <input type="text" id="otherSkills" class="mt-1 block w-full border border-gray-300 rounded-md p-2 bg-yellow-50 transition-colors">
            </div>

            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">Submit</button>
        </form>
    </section>

    <!-- Open Library Search Section -->
    <section class="bg-white p-6 rounded shadow-md">
        <h2 class="text-2xl font-bold mb-4">Skill Discovery (via Open Library API)</h2>
        <p class="text-gray-600 text-sm mb-4">Search for a topic (e.g., "Python", "Management") and pick a book title to add as your custom skill.</p>
        <div class="flex space-x-4 mb-4">
            <input type="text" id="searchQuery" placeholder="Search for a skill topic..." class="flex-1 border border-gray-300 rounded-md p-2">
            <button id="searchBtn" class="bg-green-600 text-white px-4 py-2 rounded-md hover:bg-green-700">Search</button>
        </div>

        <div id="loading" class="hidden text-blue-600 font-semibold mb-2">Searching... Please wait.</div>
        <div id="errorMessage" class="hidden text-red-600 font-semibold mb-2"></div>

        <ul id="resultsList" class="space-y-3"></ul>
    </section>

</div>

<script>
    // --- Skills Dropdown Logic ---
    const skillsSelect = document.getElementById('skills');
    const otherSkillsContainer = document.getElementById('otherSkillsContainer');
    const otherSkillsInput = document.getElementById('otherSkills');

    skillsSelect.addEventListener('change', function() {
        if (this.value === 'other') {
            otherSkillsContainer.classList.remove('hidden');
            otherSkillsInput.required = true;
        } else {
            otherSkillsContainer.classList.add('hidden');
            otherSkillsInput.required = false;
            otherSkillsInput.value = '';
        }
    });

    // --- Form Submission Logic ---
    document.getElementById('userForm').addEventListener('submit', async function(event) {
        event.preventDefault();

        const firstName = document.getElementById('firstName').value.trim();
        const lastName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();

        if (!firstName || !lastName || !email) {
            alert("First Name, Last Name, and Email are required.");
            return;
        }

        const formData = {
            firstName: firstName,
            lastName: lastName,
            email: email,
            phone: document.getElementById('phone').value.trim(),
            skills: skillsSelect.value === 'other' ?
                otherSkillsInput.value.trim() :
                skillsSelect.value
        };

        try {
            const response = await fetch('http://localhost:3000/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (response.status === 201) {
                alert('User saved successfully to database! ID: ' + result.id);
                document.getElementById('userForm').reset();
                otherSkillsContainer.classList.add('hidden');
            } else {
                alert('Error: ' + (result.error || 'Failed to save user.'));
            }
        } catch (error) {
            alert('Network error: Could not connect to the backend API. Make sure node server.js is running.');
            console.error('Fetch error:', error);
        }
    });

    // --- Open Library Search Logic ---
    document.getElementById('searchBtn').addEventListener('click', async function() {
        const query = document.getElementById('searchQuery').value.trim();
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const resultsList = document.getElementById('resultsList');

        errorMessage.classList.add('hidden');
        resultsList.innerHTML = '';

        if (!query) {
            errorMessage.textContent = 'Please enter a topic to search.';
            errorMessage.classList.remove('hidden');
            return;
        }

        loading.classList.remove('hidden');

        try {
            // Changed from search.json?title= to search.json?q= to capture broader topics as skills
            const response = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=5`);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            if (data.docs && data.docs.length > 0) {
                data.docs.forEach(book => {
                    // Create list item container
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center bg-gray-50 p-3 rounded border border-gray-200";

                    // Text content (Title & Author)
                    const textSpan = document.createElement('span');
                    const author = book.author_name ? book.author_name.join(', ') : 'Unknown Author';
                    textSpan.textContent = `${book.title} (by ${author})`;
                    textSpan.className = "text-gray-800 font-medium";

                    // "Select" button integration
                    const selectBtn = document.createElement('button');
                    selectBtn.textContent = "Pick this skill";
                    selectBtn.className = "bg-indigo-100 text-indigo-700 px-3 py-1 rounded text-sm font-semibold hover:bg-indigo-200 ml-4 shrink-0";

                    // Populate form on click
                    selectBtn.onclick = () => {
                        // 1. Force the dropdown to "other"
                        skillsSelect.value = 'other';

                        // 2. Unhide the text box and require it
                        otherSkillsContainer.classList.remove('hidden');
                        otherSkillsInput.required = true;

                        // 3. Populate the text box with the book title
                        otherSkillsInput.value = book.title;

                        // 4. Highlight the input briefly to show the user what changed
                        otherSkillsInput.focus();

                        // 5. Scroll back up to the form
                        document.getElementById('userForm').scrollIntoView({ behavior: 'smooth', block: 'start' });
                    };

                    li.appendChild(textSpan);
                    li.appendChild(selectBtn);
                    resultsList.appendChild(li);
                });
            } else {
                resultsList.innerHTML = '<li class="text-gray-500 italic">No topics found. Try another search.</li>';
            }
        } catch (error) {
            errorMessage.textContent = 'Failed to fetch data from Open Library. Please try again.';
            errorMessage.classList.remove('hidden');
            console.error("Open Library API Error: ", error);
        } finally {
            loading.classList.add('hidden');
        }
    });
</script>
</body>
</html>
